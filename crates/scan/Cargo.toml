[package]
name = "scan"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Find duplicate files, older copies, old installers, and regenerable caches"

[dependencies]
blake3 = "1"
policy = { path = "../policy" }
serde = { version = "1", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
filetime = "0.2"
platform = { path = "../platform" }
